[project]
name = "paczkomaty"
version = "0.1.0"
description = "Dostepnosc paczkomatow w Polsce i rekomendacje nowych lokalizacji"
readme = "README.md"
authors = [{ name = "Maciej Bujalski" }]
requires-python = ">=3.13"
dependencies = [
    "h3>=4.5.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
